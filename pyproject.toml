[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quotes-scraper-fei-liu"
version = "0.1.0"
description = "Command-line scraper for quotes.toscrape.com"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "python-dotenv>=1.0"
]

[project.scripts]
quotes-scraper = "quotes_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]